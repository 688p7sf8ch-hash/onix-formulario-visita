<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>App de Presupuestos — Onix System</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#010326">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Onix Presupuestos">
<script>
  // Destino real: app de aprobación de Bruno (servida por Apps Script).
  // authuser=0 evita el error "No se pudo abrir el archivo" de Google cuando
  // hay varias cuentas logueadas (fuerza a usar la primera y no mostrar el selector).
  var DEST = "https://script.google.com/macros/s/AKfycbz8m3VFQYDvon_vgk-dsNZDISIttOFDdv4DoUmMeKgbLIzdmvZ2KRNBQkh_0nOEhDqUIA/exec?app=bruno&key=1ARRvibyWVrWbSsjvQyii9fm3J6nfsT1&authuser=0";
  try { location.replace(DEST); } catch (e) { location.href = DEST; }
</script>
<meta http-equiv="refresh" content="2; url=https://script.google.com/macros/s/AKfycbz8m3VFQYDvon_vgk-dsNZDISIttOFDdv4DoUmMeKgbLIzdmvZ2KRNBQkh_0nOEhDqUIA/exec?app=bruno&amp;key=1ARRvibyWVrWbSsjvQyii9fm3J6nfsT1&amp;authuser=0">
<style>
  :root{
    --navy:#010326;
    --green:#06664E;
    --orange:#F25116;
    --bg:#f2f4f3;
    --card:#ffffff;
    --border:#e2e5e2;
    --text:#171a1f;
    --muted:#6b7178;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-tap-highlight-color:transparent;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    max-width:420px;
    width:100%;
    padding:32px 24px;
    text-align:center;
    box-shadow:0 1px 3px rgba(1,3,38,.06), 0 8px 28px rgba(1,3,38,.08);
  }
  .logo{width:56px;height:56px;border-radius:14px;margin:0 auto 18px;display:block;}
  h1{font-size:1.15rem;margin:0 0 6px;color:var(--navy);}
  p{font-size:.95rem;color:var(--muted);margin:0 0 20px;line-height:1.5;}
  .btn{
    display:inline-block;
    background:var(--green);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    font-size:1rem;
    padding:14px 22px;
    border-radius:12px;
    width:100%;
  }
  .spinner{
    width:26px;height:26px;
    border:3px solid var(--border);
    border-top-color:var(--green);
    border-radius:50%;
    margin:0 auto 18px;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .hint{margin-top:16px;font-size:.8rem;color:var(--muted);}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="../icon-192.png" alt="Onix System">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Abriendo la app…</h1>
    <p>Si no se abre sola en unos segundos, tocá el botón:</p>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbz8m3VFQYDvon_vgk-dsNZDISIttOFDdv4DoUmMeKgbLIzdmvZ2KRNBQkh_0nOEhDqUIA/exec?app=bruno&amp;key=1ARRvibyWVrWbSsjvQyii9fm3J6nfsT1&amp;authuser=0" rel="nofollow">Ir a la app de presupuestos</a>
    <div class="hint">Si dice "No se pudo abrir el archivo", abrí este link en una pestaña privada de Safari, o probá con otra de tus cuentas de Google.</div>
  </div>
</body>
</html>
